[project]
name = "torch-webgpu"
version = "0.0.1"
description = "PyTorch compiler and WebGPU runtime"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Jędrzej Maczan", email = "jedrzejpawel@maczan.pl" },
]
license = { text = "MIT" }
keywords = ["pytorch", "webgpu", "deep-learning", "machine-learning", "gpu", "torch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy",
]

[project.optional-dependencies]
docs = ["mkdocs", "mkdocs-material"]
dev = ["pytest", "mkdocs", "mkdocs-material", "ruff"]

[project.urls]
Homepage = "https://github.com/jmaczan/torch-webgpu"
Documentation = "https://jmaczan.github.io/torch-webgpu"
Repository = "https://github.com/jmaczan/torch-webgpu"
Issues = "https://github.com/jmaczan/torch-webgpu/issues"

[build-system]
requires = ["setuptools", "wheel", "torch", "numpy"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 88
