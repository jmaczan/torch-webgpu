name: Tests

# Runs the Python and C++ suites on GPU-less runners through Mesa's software
# drivers: lavapipe (Vulkan) and llvmpipe (OpenGL ES, WebGPU compatibility
# mode). Dawn is built once per pinned revision and cached.

on:
  push:
    branches: [main, "revival/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # nightly: also runs the slow suites

concurrency:
  group: tests-${{ github.ref }}
  # Pushes queue instead of cancelling: the first Dawn build must finish to
  # populate the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DAWN_REV: 514f52054a84babc8ca223d465c0a24d8d20e04d
  TORCH_VERSION: "2.15.0"
  PYTHON_VERSION: "3.12"

jobs:
  dawn:
    name: Dawn (Vulkan + GL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: dawn-install
          key: dawn-linux-gl-${{ env.DAWN_REV }}-${{ hashFiles('scripts/build-dawn.sh') }}
      - name: Install toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libx11-dev libx11-xcb-dev libxcb1-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev libegl-dev libgles-dev
          # Dawn is developed against recent clang (as its own bots use); build
          # with a current release rather than the distribution's clang 18.
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          clang++-20 --version; cmake --version; ninja --version
      - name: Build Dawn
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CC: clang-20
          CXX: clang++-20
          CMAKE_GENERATOR: Ninja
          DAWN_ENABLE_GL: "ON"
          NUM_JOBS: "3"   # clang on Tint needs a few GiB per job; runners have 16
        run: |
          set -o pipefail
          free -g; nproc
          # On failure, surface the compiler errors as annotations (readable
          # without access to the job log).
          ./scripts/build-dawn.sh dawn-install 2>&1 | tee dawn-build.log || {
            grep -E "error|Error|FAILED|Killed|No space" dawn-build.log | grep -v "Werror" | tail -15 |
              while IFS= read -r line; do echo "::error::${line:0:900}"; done
            tail -5 dawn-build.log | while IFS= read -r line; do echo "::error::tail: ${line:0:900}"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-install
          path: dawn-install
          retention-days: 3

  test:
    name: Tests (${{ matrix.backend }})
    needs: dawn
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: vulkan      # lavapipe
          - backend: opengles    # llvmpipe, compatibility mode
    env:
      TORCH_WEBGPU_BACKEND: ${{ matrix.backend }}
      # Headless Mesa EGL for the OpenGL ES backend.
      EGL_PLATFORM: surfaceless
      TORCH_WEBGPU_FALLBACK_WARN: "0"
      HF_HUB_OFFLINE: "1"
      # Software rasterizers: one device thread per core is plenty.
      LP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dawn-install
          path: dawn-install
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libegl1 libgles2 libegl-mesa0 ninja-build
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest pytest-xdist pytest-timeout expecttest hypothesis pyyaml
      - name: Build torch-webgpu
        run: DAWN_PREFIX=$PWD/dawn-install python -m pip install -e . --no-build-isolation
      - name: Device info
        run: |
          set -o pipefail
          TORCH_WEBGPU_DEBUG=1 python -c "import torch, torch_webgpu; print(torch.webgpu.get_device_properties())" 2>&1 | tee device.log || {
            tail -15 device.log | while IFS= read -r line; do echo "::error::${line:0:900}"; done; exit 1; }
      - name: Python tests
        run: |
          MARKS="not slow"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MARKS=""; fi
          set -o pipefail
          python -m pytest tests -q -rfE -m "$MARKS" --timeout 1800 --junitxml=pytest-${{ matrix.backend }}.xml 2>&1 | tee pytest.log || {
            grep -E "^(FAILED|ERROR)|Error" pytest.log | head -40 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            tail -3 pytest.log | while IFS= read -r line; do echo "::error::tail: ${line:0:900}"; done
            exit 1; }
      - name: C++ tests
        if: matrix.backend == 'vulkan'
        run: |
          DAWN_PREFIX=$PWD/dawn-install ./build-ctests.sh
          ./run-ctests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.backend }}
          path: pytest-*.xml
